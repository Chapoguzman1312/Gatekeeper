app = "gatekeeper"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/gatekeeper.db"

# The volume is not optional. Without it, every redeploy wipes the membership
# table and the next sweep sees a group full of strangers.
[mounts]
  source = "gatekeeper_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
